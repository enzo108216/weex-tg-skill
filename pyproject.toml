[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weex-tg-bot"
version = "0.1.0"
description = "Daily WEEX Partner rebate summaries to Telegram"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
keyring = ["keyring>=25"]

[tool.setuptools.packages.find]
include = ["weex_tg_bot*"]

[tool.setuptools.package-data]
weex_tg_bot = ["locales/*.json"]
